services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  webapi:
    build: .
    depends_on:
      - database
    environment:
      ConnectionStrings__PgSQL: Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5000:80"

  frontend:
    build:
      context: ./HotelReservation.Frontend
      dockerfile: Dockerfile
    depends_on:
      - webapi
    ports:
      - "3000:80"